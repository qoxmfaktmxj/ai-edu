    <style>

        margin: 0;

        font-family: "Pretendard Variable", sans-serif;

      #shadow {

  <body>

        <div data-hf-id="hf-xtks" class="txt ttl">딸기</div>
        <div data-hf-id="hf-r2np" class="txt sub">한 알, 선명한 순간.</div>

      <audio data-hf-id="hf-qvct" id="soundtrack" src="assets/audio/soundtrack.m4a" data-start="0" data-duration="28" data-track-index="4" data-volume="1"></audio>

    <script>
      (function () {
        const A = window.StrawberryArt;
        const $ = (id) => document.getElementById(id);
        const SVG = (vb, inner) => `<svg viewBox="${vb}" preserveAspectRatio="xMidYMid meet">${inner}</svg>`;

        // ---------- build art ----------
        $("defsInner").innerHTML = A.defs + A.pieceSymbols();
        $("hero").innerHTML = SVG(
          "0 0 600 800",
          A.berry() +
            `<g id="sweep" clip-path="url(#bodyClip)"><rect id="sweepR" x="-45" y="-200" width="90" height="400" fill="url(#sweepG)"/></g>` +
            `<clipPath id="hdClip"><circle cx="417" cy="471" r="15"/></clipPath>` +
            `<g id="heroDrop" opacity="0"><use href="#dropB" x="400" y="453" width="34" height="34"/>` +
            `<g clip-path="url(#hdClip)"><rect id="hdSweep" x="-4" y="440" width="8" height="64" fill="#fff" opacity="0.85" transform="rotate(24 0 471)"/></g></g>`,
        );
        const half = (c, b, edgeX) =>
          SVG(
            "0 0 600 800",
            `<use href="#berryArt" clip-path="url(#${c})"/><path d="${A.BODY}" fill="url(#fleshBand)" clip-path="url(#${b})"/>` +
              `<g clip-path="url(#bodyClip)"><rect x="${edgeX}" y="150" width="2" height="650" fill="#fff6f0" opacity="0.9"/></g>`,
          );
        $("halfL").innerHTML = half("cutL", "bandL", 298);
        $("halfR").innerHTML = half("cutR", "bandR", 300);
        $("section").innerHTML = SVG("0 0 600 800", A.section());

        // the section outline with the calyx notch smoothed away (reads as fruit, not as a heart)
        const MASK_SHAPE = A.BODY.replace("M300 176 C350 162", "M300 160 C350 156").replace("C164 166 250 162 300 176 Z", "C164 160 250 156 300 160 Z");
        const MASK_COLORS = [["#ff9096", "#ff6d75"], ["#f2475a", "#e3283f"], ["#fffaf6", "#ffeadf"], ["#2b0f18", "#17090f"]];
        $("masks").innerHTML = MASK_COLORS.map(
          (c, i) =>
            `<svg class="layer mask-layer" viewBox="0 0 1920 1080"><radialGradient id="mg${i}" cx="0.42" cy="0.4" r="0.7">` +
            `<stop offset="0" stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></radialGradient>` +
            `<path id="m${i}" d="${MASK_SHAPE}" fill="url(#mg${i})"/></svg>`,
        ).join("");

        // seeded PRNG for every particle decision
        function prng(seed) {
          return function () {
            seed = (seed + 0x6d2b79f5) | 0;
            let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        const SPARK = `<path class="spark" opacity="0" d="M33 12 L35.5 27.5 L51 30 L35.5 32.5 L33 48 L30.5 32.5 L15 30 L30.5 27.5 Z" fill="#fff"/>`;
        function particle(parent, sym, size, isPiece) {
          const d = document.createElement("div");
          d.className = "obj";
          d.style.width = size + "px";
          d.style.height = size + "px";
          d.style.margin = `${-size / 2}px 0 0 ${-size / 2}px`;
          d.innerHTML = isPiece
            ? SVG("0 0 120 120", `<use href="#${sym}"/>`)
            : SVG("0 0 100 100", `<use href="#${sym}" width="100" height="100"/>${SPARK}`);
          parent.appendChild(d);
          return d;
        }
        const DROPS = ["dropA", "dropB", "dropC"];

        // scene 2: three drops behind, two in front
        const s2 = [
          { el: particle($("backP"), "dropB", 72), x: 1470, y: 300, dy: -26, blur: 1.2 },
          { el: particle($("backP"), "dropC", 46), x: 1650, y: 650, dy: -18, blur: 1.4 },
          { el: particle($("backP"), "dropA", 58), x: 1312, y: 846, dy: -22, blur: 1.2 },
          { el: particle($("frontP"), "dropA", 280), x: 2090, x2: 1560, y: 74, dy: -10, blur: 1.6 },
          { el: particle($("frontP"), "dropB", 124), x: 330, x2: 268, y: 936, dy: -24, blur: 0.8 },
        ];

        // scene 5: 18 drops + 4 pieces along one asymmetric ribbon
        const R = prng(1505);
        const s5 = [];
        for (let i = 0; i < 22; i++) {
          const piece = i >= 18;
          const front = piece ? i % 2 === 0 : i % 2 === 1;
          const size = piece ? 96 + R() * 56 : front ? 70 + R() * 110 : 40 + R() * 60;
          const sym = piece ? "piece" + (i - 18) : DROPS[i % 3];
          let lane = (R() - 0.5) * 2 * 240;
          const minLane = piece ? 260 : 120;
          if (front && Math.abs(lane) < minLane) lane = Math.sign(lane || 1) * (minLane + R() * 70);
          s5.push({
            el: particle($(front ? "frontP" : "backP"), sym, Math.round(size), piece),
            piece,
            front,
            u0: -0.06 + ((i * 7) % 22) / 22 * 0.86 + (R() - 0.5) * 0.04,
            k: 0.7 + R() * 0.6,
            lane,
            depth: front ? 1.55 : 0.45,
            scale: front ? 1.05 + R() * 0.3 : 0.62 + R() * 0.2,
            blur: front ? (size > 90 ? 1.8 : 0.7) : 1.5,
            rot0: R() * 360,
            spin: (R() - 0.5) * 140,
            lag: R() * 0.16,
          });
        }

        // scene 6: a few quiet drops
        const s6p = [
          [250, 270, 46, "dropA"],
          [1690, 300, 62, "dropB"],
          [1560, 900, 38, "dropC"],
          [360, 860, 56, "dropB"],
          [1190, 140, 30, "dropA"],
        ].map(([x, y, s, sym], i) => ({ el: particle($("p6"), sym, s), x, y, i }));

        // lens drop for the scene 5 -> 6 wipe
        $("lens").innerHTML = SVG("0 0 100 100", `<use href="#dropA" width="100" height="100"/>`);

        // ---------- time helpers ----------
        const EZ = {};
        const ease = (name) => EZ[name] || (EZ[name] = gsap.parseEase(name));
        const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
        const lerp = (a, b, p) => a + (b - a) * p;
        const seg = (t, t0, t1, e) => {
          const p = clamp((t - t0) / (t1 - t0), 0, 1);
          return e ? ease(e)(p) : p;
        };
        // keyframes: [[time, value, easeIntoThisKey], ...]
        function kf(t, k) {
          if (t <= k[0][0]) return k[0][1];
          for (let i = 1; i < k.length; i++) {
            if (t <= k[i][0]) {
              const p = (t - k[i - 1][0]) / (k[i][0] - k[i - 1][0]);
              return lerp(k[i - 1][1], k[i][1], k[i][2] ? ease(k[i][2])(p) : p);
            }
          }
          return k[k.length - 1][1];
        }
        const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
        const mix = (a, b, p) => {
          const x = hex(a), y = hex(b);
          return `rgb(${x.map((v, i) => Math.round(lerp(v, y[i], p))).join(",")})`;
        };
        const place = (el, x, y, s, r, extra) =>
          (el.style.transform = `translate(${x.toFixed(2)}px,${y.toFixed(2)}px) rotate(${(r || 0).toFixed(3)}deg) scale(${s.toFixed(4)})${extra || ""}`);
        const show = (el, on) => (el.style.display = on ? "" : "none");

        // scene 5 particle clock: speed profile with a true stop at 15.25-15.65s.
        // Integrated once at setup on a fixed grid, so position is a pure function of t.
        function speed(t) {
          if (t < 14.2) return 0;
          if (t < 14.5) return ease("sine.in")((t - 14.2) / 0.3);
          if (t < 15.1) return 1;
          if (t < 15.25) return Math.pow(1 - (t - 15.1) / 0.15, 2);
          if (t < 15.65) return 0;
          if (t < 16.0) return ease("power2.in")((t - 15.65) / 0.35);
          return 1;
        }
        const DT = 1 / 600, P0 = 14, PT = [0];
        for (let i = 1; i <= 5 * 600; i++) PT.push(PT[i - 1] + speed(P0 + (i - 0.5) * DT) * DT);
        const travel = (t) => {
          const f = clamp((t - P0) / DT, 0, PT.length - 1);
          const i = Math.floor(f);
          return i >= PT.length - 1 ? PT[PT.length - 1] : lerp(PT[i], PT[i + 1], f - i);
        };
        const RB = [[-250, 1020], [620, 1120], [980, 120], [2250, -40]];
        function bez(u) {
          const v = 1 - u;
          const b = [v * v * v, 3 * v * v * u, 3 * v * u * u, u * u * u];
          return [0, 1].map((k) => b[0] * RB[0][k] + b[1] * RB[1][k] + b[2] * RB[2][k] + b[3] * RB[3][k]);
        }
        function tangent(u) {
          const v = 1 - u;
          return [0, 1].map(
            (k) => 3 * v * v * (RB[1][k] - RB[0][k]) + 6 * v * u * (RB[2][k] - RB[1][k]) + 3 * u * u * (RB[3][k] - RB[2][k]),
          );
        }
        function ribbon(u, lane) {
          const uc = clamp(u, 0, 1);
          const p = bez(uc), d = tangent(uc);
          const len = Math.hypot(d[0], d[1]);
          const nx = -d[1] / len, ny = d[0] / len;
          return [p[0] + (d[0] / len) * (u - uc) * 2600 + nx * lane, p[1] + (d[1] / len) * (u - uc) * 2600 + ny * lane, Math.atan2(d[1], d[0])];
        }

        // ---------- hero path ----------
        function heroState(t) {
          let x, y, s, r = 0;
          if (t < 1.6) {
            // scene 1: one vector original, zoomed from the surface out to the whole fruit
            const s0 = lerp(7.6, 7.2, seg(t, 0, 0.35)), s1 = 0.92;
            const e = t < 0.35 ? 0 : t < 1.05 ? 0.58 * ease("power2.in")((t - 0.35) / 0.7) : 0.58 + 0.42 * ease("power2.out")((t - 1.05) / 0.55);
            s = Math.exp(Math.log(s0) + (Math.log(s1) - Math.log(s0)) * e);
            const fx = -52 * (1 - e), fy = 18 * (1 - e);
            x = lerp(960, 800, e) - s * fx;
            y = lerp(540, 548, e) - s * fy;
          } else if (t < 6.5) {
            x = kf(t, [[1.6, 800], [2.55, 800], [5.4, 1190, "power3.out"], [6.0, 960, "power2.inOut"]]);
            y = kf(t, [[1.6, 548], [1.9, 539, "sine.out"], [2.4, 548, "sine.inOut"], [2.6, 548], [5.3, 530, "sine.inOut"], [5.4, 530], [6.0, 525, "power2.inOut"]]);
            s = kf(t, [[2.6, 0.92], [5.3, 0.9, "sine.inOut"], [5.4, 0.9], [6.0, 0.88, "power2.inOut"]]);
            r = kf(t, [[2.55, 0], [5.4, 6, "sine.inOut"], [6.0, 0, "power2.inOut"]]);
          } else if (t < 18.55) {
            x = kf(t, [[11.45, 960], [12.35, 690, "power3.out"], [13.75, 700, "sine.inOut"], [14.4, 960, "power2.inOut"]]);
            y = kf(t, [[6.0, 525], [11.45, 587], [12.35, 560, "power3.out"], [13.75, 556], [14.4, 540, "power2.inOut"]]);
            s = kf(t, [[6.0, 0.88], [11.45, 0.3], [12.35, 1.15, "power3.out"], [13.75, 1.12], [14.4, 0.86, "power2.inOut"]]);
            r = kf(t, [[11.45, -22], [12.35, -8, "power3.out"], [13.75, -8], [14.4, -3, "power2.inOut"], [18.4, 2, "sine.inOut"]]);
          } else {
            x = kf(t, [[18.6, -380], [20.5, 940, "power3.out"], [21.3, 962, "sine.out"], [22.4, 1160, "power2.inOut"], [23.35, 1160], [24.6, 960, "power3.inOut"]]);
            y = kf(t, [[18.6, 600], [20.5, 500, "power3.out"], [21.3, 494, "sine.out"], [22.4, 790, "power2.inOut"], [23.35, 790], [24.6, 420, "power3.inOut"]]);
            s = kf(t, [[18.6, 0.66], [21.3, 0.66], [22.4, 0.55, "power2.inOut"], [23.35, 0.55], [24.6, 0.74, "power3.inOut"]]);
            r = kf(t, [[18.6, -18], [20.5, 0, "power3.out"], [21.4, 2, "sine.out"], [22.5, 0, "power2.inOut"]]);
          }
          // slow float, kept out of the swap, the zoom and the big moves
          const calm = t < 2.4 || (t > 5.3 && t < 12.4) || (t > 18.4 && t < 22.6) || (t > 23.3 && t < 24.7) ? 0 : 1;
          y += calm * 4 * Math.sin((t / 4.2) * Math.PI * 2);
          return { x, y, s, r };
        }

        // camera offset (scene 5 parallax, kept alive during the freeze)
        const camX = (t) => -36 * seg(t, 15.05, 15.95, "sine.inOut") + 36 * seg(t, 16.4, 17.6, "sine.inOut");
        const camY = (t) => -8 * seg(t, 15.05, 15.95, "sine.inOut") + 8 * seg(t, 16.4, 17.6, "sine.inOut");

        // ---------- the one frame function ----------
        const el = {};
        ["bg", "creamVig", "light", "glow", "shadow", "hero", "exhibit", "halfL", "halfR", "section", "cutLight", "masks", "s6", "bigword", "lens", "macro", "sweep", "sweepR", "heroDrop", "hdSweep", "secLine"].forEach(
          (id) => (el[id] = $(id)),
        );
        const maskEls = [0, 1, 2, 3].map((i) => $("m" + i));
        const maskLayers = Array.from(document.querySelectorAll(".mask-layer"));
        const txt = (id) => $(id).querySelector(".txt");
        const T = { t1: txt("t1"), t2: txt("t2"), t4: txt("t4"), t7a: $("t7").querySelector(".ttl"), t7b: $("t7").querySelector(".sub") };

        function textIn(node, t, tIn, tOut, rise) {
          const a = seg(t, tIn, tIn + 0.45, "power3.out");
          const b = tOut ? seg(t, tOut, tOut + 0.3, "power2.in") : 0;
          node.style.opacity = (a * (1 - b)).toFixed(3);
          node.style.transform = `translateY(${((1 - a) * rise - b * 8).toFixed(2)}px)`;
          node.style.filter = `blur(${((1 - seg(t, tIn, tIn + 0.35, "power2.out")) * 7).toFixed(2)}px)`;
        }

        function render(t) {
          const cream = seg(t, 2.9, 3.7, "sine.inOut") * (t < 12.22 ? 1 : 0);
          el.bg.style.backgroundColor = mix("#17090f", "#fff3e8", cream);
          el.creamVig.style.opacity = cream;

          // scene 2 light spread from the upper-left key light
          show(el.light, t > 2.45 && t < 3.8);
          place(el.light, 360, 230, kf(t, [[2.45, 0.6], [3.75, 9, "power2.inOut"]]));
          el.light.style.opacity = seg(t, 2.5, 3.0, "sine.in");

          // hero
          const h = heroState(t);
          const camOn = t > 14 && t < 18.6;
          const hx = h.x + (camOn ? camX(t) * 0.8 : 0), hy = h.y + (camOn ? camY(t) * 0.8 : 0);
          const heroOn = t < 6.5 || t >= 11.45;
          el.hero.style.visibility = heroOn ? "visible" : "hidden";
          place(el.hero, hx, hy, h.s, h.r);
          // opacity too: the grain filter (feTurbulence) still paints under visibility:hidden
          el.hero.style.opacity = !heroOn ? 0 : t < 11.45 || t > 12 ? 1 : seg(t, 11.45, 11.7);
          const late = t >= 18.55;
          el.hero.style.zIndex = late ? 8 : 5;
          el.shadow.style.zIndex = late ? 8 : 4;
          el.macro.style.opacity = 1 - seg(t, 0.8, 1.1, "sine.inOut");
          show(el.macro, t < 1.15);
          show(el.sweep, t < 1.0);
          el.sweep.style.opacity = 1 - seg(t, 0.75, 1.0);
          el.sweepR.setAttribute("transform", `translate(${lerp(130, 370, seg(t, 0.05, 0.85, "power1.inOut")).toFixed(2)} 420) rotate(24)`);
          el.heroDrop.setAttribute("opacity", seg(t, 24.6, 25.0).toFixed(3));
          el.hdSweep.setAttribute("x", lerp(392, 446, seg(t, 26.0, 26.9, "sine.inOut")).toFixed(2));

          // ground shadow + backglow follow the hero
          const shOp =
            t < 6.6 ? lerp(seg(t, 1.2, 1.8) * 0.45, 0.6, cream) * (1 - seg(t, 6.3, 6.6)) : t < 11.45 ? 0 : t < 18.55 ? 0.3 * seg(t, 11.8, 12.4) : t < 23.4 ? 0.55 * seg(t, 18.6, 19.0) : lerp(0.55, 0.32, seg(t, 23.4, 24.2));
          el.shadow.style.opacity = shOp.toFixed(3);
          place(el.shadow, hx + 8 * h.s, (late ? Math.max(h.y, 0) : hy) + 420 * h.s, h.s * 1.02);
          const glowOp = Math.max(
            seg(t, 1.0, 1.8) * (1 - seg(t, 2.6, 3.2)),
            seg(t, 11.6, 12.4) * (1 - seg(t, 17.8, 18.3)),
            seg(t, 23.6, 24.6),
          );
          el.glow.style.opacity = glowOp.toFixed(3);
          place(el.glow, hx, hy + 40 * h.s, h.s * 1.1);

          // ---------- scene 3-4: exhibit (halves + section) ----------
          const exOn = t >= 5.9 && t < 12.24;
          show(el.exhibit, exOn);
          if (exOn) {
            const open = seg(t, 6.55, 7.7, "power3.inOut");
            const settle = seg(t, 7.7, 10.0, "sine.inOut");
            const push = seg(t, 10.0, 10.75, "power2.in");
            const sc = 1 + 0.9 * push;
            const C = [960, 525 + 0.88 * 70];
            const at = (dx, dy, k) => [C[0] + (dx * sc) * k, C[1] + (dy * sc) * k];
            const base = [960 - C[0], 525 - C[1]];
            const halvesOn = t >= 6.5;
            show(el.halfL, halvesOn);
            show(el.halfR, halvesOn);
            const kH = 1 + 0.35 * push;
            let p = at(base[0] - 150 * open, base[1] - 117 * open - 6 * settle, kH);
            place(el.halfL, p[0], p[1], 0.88 * (1 - 0.05 * open) * sc, -12 * open - 0.6 * settle);
            p = at(base[0] + 150 * open, base[1] + 117 * open + 6 * settle, kH);
            place(el.halfR, p[0], p[1], 0.88 * (1 + 0.04 * open) * sc, 10 * open + 0.6 * settle);
            const sh = (o) => `drop-shadow(0 ${(18 + 14 * o).toFixed(1)}px ${(26 + 10 * o).toFixed(1)}px rgba(90, 14, 30, ${(0.26 + 0.08 * o).toFixed(3)}))`;
            el.halfL.style.filter = sh(open * 0.4);
            el.halfR.style.filter = sh(open);
            const rev = seg(t, 6.5, 7.3, "power2.inOut");
            const near = seg(t, 6.6, 7.9, "power3.out");
            show(el.section, t >= 6.5);
            p = at(base[0], base[1], 1);
            place(el.section, p[0], p[1], 0.88 * (0.86 + 0.14 * near + 0.012 * settle) * sc, 0);
            el.section.style.clipPath = rev >= 1 ? "none" : `inset(0 ${(50 * (1 - rev)).toFixed(2)}% 0 ${(50 * (1 - rev)).toFixed(2)}%)`;
            el.section.style.filter = `drop-shadow(0 ${(10 + 26 * near).toFixed(1)}px ${(18 + 22 * near).toFixed(1)}px rgba(90, 14, 30, ${(0.18 + 0.16 * near).toFixed(3)}))`;
            el.secLine.setAttribute("stroke-dashoffset", (1 - seg(t, 10.12, 10.68, "power2.inOut")).toFixed(4));
          }

          // vertical light that becomes the cut (above the hero)
          show(el.cutLight, t >= 5.95 && t < 6.9);
          place(el.cutLight, 960, 525 + 0.88 * 72, 1, 0, ` scaleX(${(1 + 2.5 * seg(t, 6.42, 6.6, "power2.out")).toFixed(3)}) scaleY(${seg(t, 5.95, 6.4, "power2.out").toFixed(3)})`);
          el.cutLight.style.opacity = (seg(t, 5.95, 6.1) * (1 - seg(t, 6.55, 6.85, "power2.in"))).toFixed(3);

          // ---------- scene 4: organic masks grow from the section outline ----------
          const mOn = t >= 10.6 && t < 12.24;
          show(el.masks, mOn);
          if (mOn) {
            const C = [960, 525 + 0.88 * 70];
            maskEls.forEach((m, i) => {
              const t0 = 10.62 + i * 0.2;
              const p = seg(t, t0, t0 + 1.0, "power2.inOut");
              show(maskLayers[i], t >= t0);
              const s = lerp(i === 0 ? 0.88 * 1.9 * 0.985 : 0.12, 9.6, p);
              const rr = [9, -11, 12, -6][i] * p;
              const cx = lerp(C[0], 960 + [30, -40, 20, 0][i], p), cy = lerp(C[1], 540 + [-30, 20, 10, 0][i], p);
              m.setAttribute("transform", `translate(${cx.toFixed(2)} ${cy.toFixed(2)}) rotate(${rr.toFixed(3)}) scale(${s.toFixed(4)}) translate(-300 -470)`);
            });
          }

          // ---------- scene 2 drops ----------
          const s2On = t > 2.6 && t < 6.15;
          s2.forEach((d, i) => {
            show(d.el, s2On);
            if (!s2On) return;
            const p = seg(t, 2.6, 6.0, "sine.inOut");
            const x = d.x2 !== undefined ? lerp(d.x, d.x2, seg(t, 2.6, 6.0, "power1.out")) : d.x - 30 * p;
            const op = seg(t, 2.75 + i * 0.08, 3.25 + i * 0.08) * (1 - seg(t, 5.65, 6.05));
            d.el.style.opacity = op.toFixed(3);
            d.el.style.filter = `blur(${d.blur}px)`;
            place(d.el, x, d.y + d.dy * p, 1, 0);
          });

          // ---------- scene 5 particles: spread, stop, restart ----------
          const s5On = t > 14.15 && t < 18.65;
          const v = speed(t), P = travel(t);
          const cx = camX(t), cy = camY(t);
          const spark = kf(t, [[15.18, 0], [15.3, 1, "power2.out"], [15.6, 0.75], [15.8, 0, "power2.in"]]);
          s5.forEach((d) => {
            show(d.el, s5On);
            if (!s5On) return;
            const u = d.u0 + d.k * 0.15 * P;
            const [rx, ry, ang] = ribbon(u, d.lane);
            const spread = seg(t, 14.2 + d.lag, 14.95 + d.lag, "power3.out");
            const x = lerp(h.x, rx, spread) + cx * d.depth;
            const y = lerp(h.y, ry, spread) + cy * d.depth;
            const sc = d.scale * (0.25 + 0.75 * spread);
            d.el.style.opacity = (seg(t, 14.2 + d.lag, 14.45 + d.lag) * (1 - seg(t, 18.35, 18.6))).toFixed(3);
            d.el.style.filter = `blur(${d.blur}px)`;
            if (d.piece) {
              place(d.el, x, y, sc, d.rot0 + d.spin * P);
            } else {
              const st = 1 + 0.14 * v * d.k;
              d.el.style.transform = `translate(${x.toFixed(2)}px,${y.toFixed(2)}px) rotate(${((ang * 180) / Math.PI).toFixed(2)}deg) scale(${(sc * st).toFixed(4)},${(sc / st).toFixed(4)}) rotate(${(-(ang * 180) / Math.PI).toFixed(2)}deg)`;
              d.el.querySelector(".spark").setAttribute("opacity", spark.toFixed(3));
            }
          });

          // ---------- scene 5 -> 6: a foreground drop becomes a lens ----------
          const lensOn = t >= 17.85 && t < 18.62;
          show(el.lens, lensOn);
          const LR = kf(t, [[17.85, 150], [18.6, 1560, "power2.in"]]);
          const LX = kf(t, [[17.85, -60], [18.6, 820, "power2.in"]]);
          const LY = kf(t, [[17.85, 820], [18.6, 560, "power1.in"]]);
          if (lensOn) {
            const w = (2 * LR) / 0.88;
            el.lens.style.width = w + "px";
            el.lens.style.height = w + "px";
            el.lens.style.margin = `${(-w / 2 - 0.02 * w).toFixed(1)}px 0 0 ${(-w / 2).toFixed(1)}px`;
            place(el.lens, LX, LY, 1, 0);
          }

          // ---------- scene 6: the name becomes the set ----------
          const s6On = t >= 17.85 && t < 24.2;
          show(el.s6, s6On);
          el.s6.style.clipPath = t < 18.6 ? `circle(${LR.toFixed(1)}px at ${LX.toFixed(1)}px ${LY.toFixed(1)}px)` : "none";
          const iris = kf(t, [[23.35, 0], [24.2, 2300, "power2.in"]]);
          const irisMask = iris > 0 ? `radial-gradient(circle ${iris.toFixed(1)}px at ${hx.toFixed(1)}px ${hy.toFixed(1)}px, transparent 98%, #000 100%)` : "none";
          el.s6.style.maskImage = irisMask;
          el.s6.style.webkitMaskImage = irisMask;
          const wIn = seg(t, 18.62, 19.5, "power3.out");
          el.bigword.style.opacity = wIn.toFixed(3);
          el.bigword.style.transform = `translateY(${((1 - wIn) * 40).toFixed(2)}px) scale(${lerp(1.06, 1, wIn).toFixed(4)})`;
          s6p.forEach((d) => {
            const on = t > 18.5 && t < 24.2;
            show(d.el, on);
            if (!on) return;
            d.el.style.opacity = (seg(t, 18.9 + d.i * 0.12, 19.5 + d.i * 0.12) * (1 - seg(t, 23.35, 23.7))).toFixed(3);
            place(d.el, d.x + 10 * Math.sin(t * 0.7 + d.i), d.y - 34 * seg(t, 18.6, 23.4), 1, 0);
          });

          // ---------- typography ----------
          textIn(T.t1, t, 1.7, 2.5, 15);
          textIn(T.t2, t, 3.2, 5.4, 15);
          textIn(T.t4, t, 11.8, 13.55, 15);
          textIn(T.t7a, t, 24.35, 0, 16);
          textIn(T.t7b, t, 24.9, 0, 14);
        }

        // one paused timeline; a single linear clock tween calls render(t)
        const clock = { t: 0 };
        const tl = gsap.timeline({ paused: true });
        tl.to(clock, { t: 28, duration: 28, ease: "none", onUpdate: () => render(clock.t) }, 0);
        render(0);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
