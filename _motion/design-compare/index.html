<!doctype html>
<html lang="ko" data-resolution="landscape">
<head><meta charset="utf-8"><meta name="viewport" content="width=1920, height=1080">
<title>빈 칸이 있는 부탁, 채운 부탁</title><script src="assets/gsap.min.js"></script>
<style>
@font-face{font-family:"Pretendard Variable";src:url("assets/PretendardVariable.woff2") format("woff2");font-weight:100 900;font-display:block}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#080e18}
#root{position:relative;width:100%;height:100%;overflow:hidden;background:#080e18;color:#f1f5ff;font-family:"Pretendard Variable",sans-serif}
#dc-glow{position:absolute;left:1000px;top:140px;width:960px;height:960px;border-radius:50%;background:radial-gradient(circle,rgba(118,160,232,.2) 0%,rgba(118,160,232,0) 64%)}
#dc-content{position:absolute;inset:0}
#dc-divider{position:absolute;left:959px;top:190px;width:2px;height:790px;background:#22344d;transform-origin:50% 0}
.dc-title{position:absolute;left:120px;top:58px;font-size:60px;font-weight:760;letter-spacing:-.03em;white-space:nowrap}
.dc-col{position:absolute;top:178px;width:780px;height:860px}
#dc-left{left:120px}#dc-right{left:1020px}
.dc-col-head{display:flex;align-items:center;gap:16px;height:60px;font-size:44px;font-weight:720;letter-spacing:-.02em}
.dc-tag{font-size:26px;font-weight:680;padding:4px 16px;border-radius:999px;background:#bad4ff;color:#10213a;letter-spacing:0}
.dc-card{position:absolute;left:0;top:84px;width:780px;height:290px;border:3px solid #3d5576;border-radius:18px;background:#111d30;padding:26px 32px}
.dc-row{display:flex;align-items:center;height:58px;font-size:34px;font-weight:560}
.dc-row b{width:200px;flex:none;font-size:29px;font-weight:620;color:#a3b7d3}
.dc-blank{display:inline-flex;align-items:center;justify-content:center;width:300px;height:46px;border:3px dashed #5d7493;border-radius:10px}
.dc-q{font-size:30px;font-weight:760;color:#a3b7d3}
.dc-send{position:absolute;right:24px;top:22px;width:52px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:#2a3f5c;color:#f1f5ff}
.dc-res-head{position:absolute;left:0;top:402px;display:flex;align-items:center;gap:14px;height:48px}
.dc-res-label{font-size:30px;font-weight:700;color:#a3b7d3;margin-right:6px}
.dc-chip{font-size:27px;font-weight:660;padding:3px 18px;border-radius:999px;border:2px solid #3d5576;color:#a3b7d3;background:#0d1626}
.dc-res{position:absolute;left:0;top:466px;width:780px;height:290px}
.dc-shape{position:absolute;inset:0;border:3px solid #3d5576;border-radius:18px;background:#111d30;padding:26px 32px;transform-origin:50% 50%}
.dc-shape-tag{position:absolute;right:26px;top:22px;font-size:26px;font-weight:640;color:#a3b7d3}
.dc-shape h5{font-size:32px;font-weight:720;margin-bottom:24px}
.dc-bar{display:block;height:16px;border-radius:8px;background:#34496a}
.dc-para .dc-bar{margin-bottom:18px}
.dc-li{display:flex;align-items:center;gap:18px;height:30px;margin-bottom:12px}
.dc-dot{width:14px;height:14px;flex:none;border-radius:50%;background:#8197b8}
.dc-table{display:grid;border:2px solid #3d5576;border-radius:12px;overflow:hidden}
.dc-th{height:50px;display:flex;align-items:center;padding:0 18px;background:#1a2a43;font-size:28px;font-weight:720}
.dc-td{height:54px;display:flex;align-items:center;padding:0 18px;border-top:2px solid #2a3c57;font-size:28px;font-weight:600}
.dc-td .dc-bar{flex:1}
.dc-t2{grid-template-columns:150px 1fr;margin-top:6px}
.dc-t3{grid-template-columns:1fr 1fr 1fr}
.dc-hl-wrap{position:relative;display:inline-block}
.dc-hl{position:absolute;left:-8px;right:-8px;top:2px;bottom:2px;border-radius:6px;background:#f2b45a;opacity:.38;transform-origin:0 50%}
.dc-hl-text{position:relative}
.dc-miss{display:inline-flex;align-items:center;gap:8px;margin-left:22px;font-size:27px;font-weight:720;color:#f4bd6b}
.dc-gist{display:flex;align-items:center;gap:18px;margin-bottom:12px}
.dc-gist b{font-size:26px;font-weight:680;color:#a3b7d3;width:60px;flex:none}
.dc-keep{color:#bad4ff;font-weight:700}
.dc-cap{position:absolute;left:0;top:784px;font-size:36px;font-weight:720;letter-spacing:-.02em}
#dc-cap-left{color:#f4bd6b}#dc-cap-right{color:#bad4ff}
</style></head><body>
<div id="root" data-composition-id="main" data-duration="12" data-width="1920" data-height="1080">
<div id="dc-glow"></div>
<div id="dc-content">
<i id="dc-divider"></i>
<h1 id="dc-title-a" class="dc-title">같은 업무 메모로 세 번 시켜 보면</h1>
<h1 id="dc-title-b" class="dc-title">빈칸은 AI가 추측으로 채웁니다.</h1>

<section id="dc-left" class="dc-col">
<h2 id="dc-left-head" class="dc-col-head">빈 칸이 있는 부탁</h2>
<div id="dc-left-card" class="dc-card">
<i id="dc-left-send" class="dc-send"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M4 12H20M13 5L20 12L13 19" stroke="currentColor" stroke-width="2.4" fill="none"/></svg></i>
<p class="dc-row dc-left-row"><b>업무</b>주간 보고 정리</p>
<p class="dc-row dc-left-row"><b>입력</b>한 주 업무 메모</p>
<p class="dc-row dc-left-row"><b>결과</b><span class="dc-blank"><span class="dc-q">?</span></span></p>
<p class="dc-row dc-left-row"><b>꼭 지킬 것</b><span class="dc-blank"><span class="dc-q">?</span></span></p>
</div>
<div id="dc-left-res-head" class="dc-res-head"><span class="dc-res-label">결과</span><span id="dc-left-chip-1" class="dc-chip">1번</span><span id="dc-left-chip-2" class="dc-chip">2번</span><span id="dc-left-chip-3" class="dc-chip">3번</span></div>
<div class="dc-res">
<div id="dc-left-r1" data-layout-allow-overlap class="dc-shape dc-para"><span class="dc-shape-tag">문단으로</span><h5>이번 주 업무</h5><i class="dc-bar" style="width:92%"></i><i class="dc-bar" style="width:98%"></i><i class="dc-bar" style="width:84%"></i><i class="dc-bar" style="width:58%"></i></div>
<div id="dc-left-r2" data-layout-allow-overlap class="dc-shape"><span class="dc-shape-tag">목록으로</span><h5>주간 보고</h5><p class="dc-li"><i class="dc-dot"></i><i class="dc-bar" style="width:62%"></i></p><p class="dc-li"><i class="dc-dot"></i><i class="dc-bar" style="width:78%"></i></p><p class="dc-li"><i class="dc-dot"></i><i class="dc-bar" style="width:48%"></i></p><p class="dc-li"><i class="dc-dot"></i><i class="dc-bar" style="width:70%"></i></p></div>
<div id="dc-left-r3" data-layout-allow-overlap class="dc-shape"><span class="dc-shape-tag">표로</span><h5>주간 업무</h5>
<div class="dc-table dc-t2"><span class="dc-th">항목</span><span class="dc-th">내용</span><span class="dc-td">완료</span><span class="dc-td"><i class="dc-bar" style="max-width:340px"></i></span><span class="dc-td">상태</span><span class="dc-td"><span class="dc-hl-wrap"><i id="dc-hl" class="dc-hl"></i><span class="dc-hl-text">완료</span></span><span id="dc-miss" class="dc-miss"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 3L22 20H2Z" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linejoin="round"/><path d="M12 10V14M12 17V17.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>메모엔 검토 중</span></span></div>
</div>
</div>
<p id="dc-cap-left" class="dc-cap">매번 다른 모양, 바뀐 상태</p>
</section>

<section id="dc-right" class="dc-col">
<h2 id="dc-right-head" class="dc-col-head">4칸을 채운 부탁 <span class="dc-tag">추천</span></h2>
<div id="dc-right-card" class="dc-card">
<i id="dc-right-send" class="dc-send"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M4 12H20M13 5L20 12L13 19" stroke="currentColor" stroke-width="2.4" fill="none"/></svg></i>
<p class="dc-row dc-right-row"><b>업무</b>주간 보고 정리</p>
<p class="dc-row dc-right-row"><b>입력</b>한 주 업무 메모</p>
<p class="dc-row dc-right-row"><b>결과</b><span id="dc-type-result" class="dc-typed">세 칸 표와 요지 두 문장</span></p>
<p class="dc-row dc-right-row"><b>꼭 지킬 것</b><span id="dc-type-rule" class="dc-typed">상태는 메모 그대로</span></p>
</div>
<div id="dc-right-res-head" class="dc-res-head"><span class="dc-res-label">결과</span><span id="dc-right-chip-1" class="dc-chip">1번</span><span id="dc-right-chip-2" class="dc-chip">2번</span><span id="dc-right-chip-3" class="dc-chip">3번</span></div>
<div class="dc-res">
<div id="dc-right-r" class="dc-shape"><span class="dc-shape-tag">표로</span>
<p class="dc-gist"><b>요지</b><i class="dc-bar" style="width:440px"></i></p>
<p class="dc-gist"><b></b><i class="dc-bar" style="width:330px"></i></p>
<div class="dc-table dc-t3"><span class="dc-th">완료</span><span class="dc-th">진행</span><span class="dc-th">다음 주</span><span class="dc-td"><i class="dc-bar"></i></span><span class="dc-td dc-keep">검토 중</span><span class="dc-td"><i class="dc-bar"></i></span><span class="dc-td"><i class="dc-bar"></i></span><span class="dc-td"><i class="dc-bar"></i></span><span class="dc-td"><i class="dc-bar" style="max-width:120px"></i></span></div>
</div>
</div>
<p id="dc-cap-right" class="dc-cap">세 번 모두 같은 모양</p>
</section>
</div>
</div>
<script>
(()=>{
const tl=gsap.timeline({paused:true,defaults:{ease:'power3.out'}});
// Letter-by-letter typing, same helper as the site intro film.
const type=(selector,start,cps=.05)=>{const el=document.querySelector(selector),words=el.textContent.split(/(\s+)/);el.textContent='';let i=0;words.forEach(word=>{if(!word.trim()){el.appendChild(document.createTextNode(word));i+=word.length;return;}const group=document.createElement('span');group.style.whiteSpace='nowrap';el.appendChild(group);[...word].forEach(c=>{const letter=document.createElement('span');letter.textContent=c;group.appendChild(letter);tl.fromTo(letter,{opacity:0},{opacity:1,duration:.01},start+i++*cps);});});};

// Ambient: the glow breathes once per loop and ends where it began.
tl.fromTo('#dc-glow',{scale:1,opacity:.85},{scale:1.08,opacity:1,duration:6,ease:'sine.inOut'},0);
tl.to('#dc-glow',{scale:1,opacity:.85,duration:6,ease:'sine.inOut'},6);

// Open
tl.fromTo('#dc-divider',{scaleY:0},{scaleY:1,duration:.8,ease:'power2.inOut'},.2);
tl.fromTo('#dc-title-a',{opacity:0,y:22},{opacity:1,y:0,duration:.45},.15);
tl.fromTo('#dc-title-b',{opacity:0,y:22},{opacity:0,y:22,duration:.01},0);
tl.fromTo('#dc-left-head',{opacity:0,x:-36},{opacity:1,x:0,duration:.45,ease:'expo.out'},.35);
tl.fromTo('#dc-right-head',{opacity:0,x:36},{opacity:1,x:0,duration:.45,ease:'expo.out'},.45);
tl.fromTo('#dc-left-card',{opacity:0,scale:.96},{opacity:1,scale:1,duration:.5,ease:'power2.out'},.6);
tl.fromTo('#dc-right-card',{opacity:0,scale:.96},{opacity:1,scale:1,duration:.5,ease:'power2.out'},.7);
tl.fromTo('.dc-left-row',{opacity:0,y:14},{opacity:1,y:0,duration:.35,stagger:.08},.85);
tl.fromTo('.dc-right-row',{opacity:0,y:14},{opacity:1,y:0,duration:.35,stagger:.08},.95);

// Left: the two blanks pulse; right: the same two slots get filled in.
tl.fromTo('#dc-left-card .dc-blank',{borderColor:'#5d7493'},{borderColor:'#f4bd6b',duration:.3,repeat:3,yoyo:true,ease:'sine.inOut'},1.45);
type('#dc-type-result',1.45);
type('#dc-type-rule',2.15);

// Both requests are sent.
['left','right'].forEach(side=>{
tl.to('#dc-'+side+'-send',{backgroundColor:'#688abd',duration:.2},2.75);
tl.fromTo('#dc-'+side+'-send',{scale:1},{scale:.84,duration:.12,repeat:1,yoyo:true,immediateRender:false},2.85);
tl.fromTo('#dc-'+side+'-res-head',{opacity:0,y:14},{opacity:1,y:0,duration:.35},3.0);
});

// Three runs on the same memo, 1.8 s apart.
const RUNS=[3.3,5.1,6.9];
const chipOn={backgroundColor:'#dce8ff',borderColor:'#dce8ff',color:'#10213a',duration:.2};
const chipDone={backgroundColor:'#1d2c44',borderColor:'#1d2c44',color:'#c6d5ea',duration:.2};
RUNS.forEach((t,i)=>{
['left','right'].forEach(side=>{
tl.to('#dc-'+side+'-chip-'+(i+1),chipOn,t);
if(i)tl.to('#dc-'+side+'-chip-'+i,chipDone,t);
});
// Left: a different shape every run (scale-swap).
const inn='#dc-left-r'+(i+1);
if(i){tl.to('#dc-left-r'+i,{scale:.72,opacity:0,duration:.32,ease:'power2.in'},t);}
tl.fromTo(inn,{scale:.72,opacity:0},{scale:1,opacity:1,duration:.55,ease:'back.out(1.6)'},i?t+.18:t);
// Right: regenerated, same shape each time.
if(!i)tl.fromTo('#dc-right-r',{scale:.72,opacity:0},{scale:1,opacity:1,duration:.55,ease:'back.out(1.6)'},t);
else tl.fromTo('#dc-right-r',{opacity:.3,y:12},{opacity:1,y:0,duration:.45,ease:'power2.out',immediateRender:false},t+.1);
});

// Run 3 turns the memo's '검토 중' into '완료'.
tl.fromTo('#dc-hl',{scaleX:0},{scaleX:1,duration:.4,ease:'power2.out'},7.55);
tl.fromTo('#dc-miss',{opacity:0,x:-12},{opacity:1,x:0,duration:.35},7.75);

// Takeaway
tl.fromTo('#dc-cap-left',{opacity:0,y:14},{opacity:1,y:0,duration:.4},8.7);
tl.fromTo('#dc-cap-right',{opacity:0,y:14},{opacity:1,y:0,duration:.4},8.85);
tl.to('#dc-title-a',{opacity:0,y:-18,duration:.25,ease:'power2.in'},9.3);
tl.to('#dc-title-b',{opacity:1,y:0,duration:.45},9.5);

// Fade back to the opening frame so the loop is seamless.
tl.fromTo('#dc-content',{opacity:1},{opacity:0,duration:.5,ease:'power2.in'},11.3);

window.__timelines.main=tl;
})();
</script>
</body></html>
